[project]
name = "vn-hybrid-search"
version = "0.1.0"
description = "Empirical comparison of lexical, dense and hybrid retrieval for Vietnamese legal text (RAG retrieval layer)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "anthropic",
    "bm25s",
    "faiss-cpu",
    "huggingface-hub",
    "numpy",
    "pandas",
    "pyarrow",
    "python-dotenv",
    "pyvi",
    "pyyaml",
    "ranx",
    "sentence-transformers",
]

[dependency-groups]
dev = [
    "ipykernel",
    "pytest",
    "ruff",
]
app = [
    "gradio",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "vnsearch"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: tests that load real models or large artifacts"]
